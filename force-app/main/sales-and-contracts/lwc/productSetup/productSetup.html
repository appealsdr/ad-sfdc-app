<template>
  <template lwc:if={showProductCreator}>
    <lightning-card title="Create Product" icon-name="standard:product">
      <div class="slds-p-around_medium">
        <p class="slds-text-color_weak slds-m-bottom_medium">
          Create the Product first, then complete pricing, required documents,
          and onboarding fields without leaving this page.
        </p>
        <lightning-record-edit-form
          object-api-name="Product2"
          onsuccess={handleProductCreated}
          onerror={handleProductError}
        >
          <lightning-messages></lightning-messages>
          <div class="slds-grid slds-wrap slds-gutters_small">
            <lightning-input-field
              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"
              field-name="Name"
            ></lightning-input-field>
            <lightning-input-field
              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"
              field-name="ProductCode"
            ></lightning-input-field>
            <lightning-input-field
              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"
              field-name="Family"
            ></lightning-input-field>
            <lightning-input-field
              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"
              field-name="Case_Type__c"
            ></lightning-input-field>
            <lightning-input-field
              class="slds-col slds-size_1-of-1"
              field-name="Description"
            ></lightning-input-field>
            <lightning-input-field
              class="slds-col slds-size_1-of-1"
              field-name="IsActive"
            ></lightning-input-field>
          </div>
          <lightning-button
            type="submit"
            label="Create Product"
            variant="neutral"
          ></lightning-button>
        </lightning-record-edit-form>
      </div>
    </lightning-card>
  </template>

  <template lwc:if={showSetup}>
    <template lwc:if={loading}>
      <lightning-spinner
        alternative-text="Loading product setup"
        size="small"
      ></lightning-spinner>
    </template>
    <template lwc:if={error}>
      <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
        {error}
      </div>
    </template>

    <lightning-tabset>
      <lightning-tab label="Price Books" value="pricing">
        <lightning-card
          title="Price Book Setup"
          icon-name="standard:price_books"
        >
          <lightning-button
            slot="actions"
            label="Save Price Books"
            variant="neutral"
            onclick={handleSavePricebooks}
            disabled={pricebookSaveDisabled}
          ></lightning-button>
          <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p class="slds-text-color_weak slds-m-bottom_small">
              Select the price books where this Product can be sold. The
              Standard Price Book is required before custom price books.
            </p>
            <div class="pricebook-list">
              <template for:each={pricebookGroups} for:item="group">
                <section key={group.key} class="pricebook-group">
                  <h3 class="pricebook-group__heading">{group.label}</h3>
                  <template for:each={group.rows} for:item="row">
                    <section
                      key={row.pricebookId}
                      class="setup-row pricebook-row"
                    >
                      <lightning-input
                        class="pricebook-input"
                        type="checkbox"
                        label={row.pricebookName}
                        checked={row.selected}
                        data-id={row.pricebookId}
                        data-field="selected"
                        onchange={handlePricebookChange}
                      ></lightning-input>
                      <lightning-input
                        class="pricebook-input"
                        type="number"
                        formatter="currency"
                        step="0.01"
                        min="0"
                        label="List Price"
                        value={row.unitPrice}
                        required={row.selected}
                        disabled={row.inputsDisabled}
                        data-id={row.pricebookId}
                        data-field="unitPrice"
                        onchange={handlePricebookChange}
                      ></lightning-input>
                      <lightning-input
                        class="pricebook-input"
                        type="number"
                        formatter="currency"
                        step="0.01"
                        min="0"
                        label="Deposit"
                        value={row.deposit}
                        disabled={row.inputsDisabled}
                        data-id={row.pricebookId}
                        data-field="deposit"
                        onchange={handlePricebookChange}
                      ></lightning-input>
                      <lightning-combobox
                        class="pricebook-input"
                        label="Payment Type"
                        value={row.paymentType}
                        options={paymentTypeOptions}
                        disabled={row.inputsDisabled}
                        data-id={row.pricebookId}
                        data-field="paymentType"
                        onchange={handlePricebookChange}
                      ></lightning-combobox>
                    </section>
                  </template>
                </section>
              </template>
            </div>
          </div>
        </lightning-card>
      </lightning-tab>
      <lightning-tab label="Onboarding Configuration" value="onboarding">
        <c-product-onboarding-config
          record-id={productId}
          object-api-name="Product2"
        ></c-product-onboarding-config>
        <lightning-card title="Required Documents" icon-name="standard:file">
          <div slot="actions" class="slds-button-group" role="group">
            <lightning-button
              label="Add Document"
              icon-name="utility:add"
              disabled={requirementSaveDisabled}
              onclick={handleAddRequirement}
            ></lightning-button>
            <lightning-button
              label="Save Documents"
              variant="neutral"
              onclick={handleSaveRequirements}
              disabled={requirementSaveDisabled}
            ></lightning-button>
          </div>
          <div class="documents-body">
            <template lwc:if={hasRequirements}>
              <ul aria-label="Required documents for this product">
                <template for:each={requirements} for:item="row">
                  <li key={row.key} class="setup-row document-row">
                    <div class="row-heading">
                      <span class="slds-text-title_bold">{row.name}</span>
                      <div class="slds-button-group" role="group">
                        <lightning-button-icon
                          icon-name="utility:edit"
                          alternative-text="Edit required document"
                          title="Edit required document"
                          disabled={requirementSaveDisabled}
                          data-key={row.key}
                          onclick={handleEditRequirement}
                        ></lightning-button-icon>
                        <lightning-button-icon
                          icon-name="utility:copy"
                          alternative-text="Clone required document"
                          title="Clone required document"
                          disabled={requirementSaveDisabled}
                          data-key={row.key}
                          onclick={handleCloneRequirement}
                        ></lightning-button-icon>
                        <lightning-button-icon
                          icon-name="utility:delete"
                          alternative-text="Remove required document"
                          title="Remove required document"
                          disabled={requirementSaveDisabled}
                          data-key={row.key}
                          onclick={handleRemoveRequirement}
                        ></lightning-button-icon>
                      </div>
                    </div>
                    <template lwc:if={row.shortDescription}>
                      <p>{row.shortDescription}</p>
                    </template>
                    <template lwc:if={row.acceptedFormat}>
                      <p>Accepted formats: {row.acceptedFormat}</p>
                    </template>
                    <template lwc:if={row.active}>
                      <span class="slds-text-color_weak">Active</span>
                    </template>
                    <template lwc:else>
                      <span class="slds-text-color_weak">Inactive</span>
                    </template>
                  </li>
                </template>
              </ul>
            </template>
            <template lwc:else>
              <p class="slds-p-vertical_xx-small slds-text-color_weak">
                No required documents configured.
              </p>
            </template>
          </div>
        </lightning-card>
      </lightning-tab>
    </lightning-tabset>

    <template lwc:if={documentDraft}>
      <section
        class="slds-modal slds-fade-in-open document-dialog"
        role="dialog"
        aria-modal="true"
        aria-label={documentDialogTitle}
        tabindex="-1"
        onkeydown={handleDocumentKeyDown}
      >
        <div class="slds-modal__container">
          <header class="slds-modal__header">
            <lightning-button-icon
              class="slds-modal__close"
              icon-name="utility:close"
              variant="bare-inverse"
              alternative-text="Close required document"
              title="Close required document"
              onclick={handleCloseDocument}
            ></lightning-button-icon>
            <h2 class="slds-text-heading_medium">{documentDialogTitle}</h2>
          </header>
          <div class="slds-modal__content slds-p-around_small">
            <lightning-input
              type="checkbox"
              label="Active"
              checked={documentDraft.active}
              data-field="active"
              onchange={handleRequirementChange}
            ></lightning-input>
            <lightning-combobox
              label="Document Template"
              value={documentDraft.templateId}
              options={templateOptions}
              onchange={handleTemplateChange}
            ></lightning-combobox>
            <lightning-input
              class="requirement-input"
              label="Document Name"
              value={documentDraft.name}
              required
              data-field="name"
              onchange={handleRequirementChange}
            ></lightning-input>
            <lightning-dual-listbox
              class="requirement-input"
              label="Accepted Formats"
              source-label="Available"
              selected-label="Selected"
              options={formatOptions}
              value={selectedFormats}
              required
              min="1"
              data-field="acceptedFormat"
              onchange={handleRequirementChange}
            ></lightning-dual-listbox>
            <lightning-textarea
              class="requirement-input"
              label="Short Description"
              value={documentDraft.shortDescription}
              required
              data-field="shortDescription"
              onchange={handleRequirementChange}
            ></lightning-textarea>
            <lightning-input-rich-text
              label="Client Instructions"
              label-visible
              required
              valid={instructionsValid}
              value={documentDraft.instructions}
              data-field="instructions"
              onchange={handleRequirementChange}
            ></lightning-input-rich-text>
            <template lwc:if={showInstructionError}>
              <p
                class="slds-form-element__help slds-text-color_error"
                role="alert"
              >
                Enter client instructions.
              </p>
            </template>
          </div>
          <footer class="slds-modal__footer">
            <lightning-button
              label="Cancel"
              onclick={handleCloseDocument}
            ></lightning-button>
            <lightning-button
              class="slds-m-left_small"
              label="Apply Document"
              variant="brand"
              onclick={handleApplyDocument}
            ></lightning-button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </template>
</template>
