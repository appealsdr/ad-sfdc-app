<template>
  <article class="workspace">
    <template lwc:if={loading}>
      <div class="state">
        <lightning-spinner
          alternative-text="Loading quotes"
          size="small"
        ></lightning-spinner>
      </div>
    </template>

    <template lwc:elseif={error}>
      <div class="state state_error" role="alert">{error}</div>
    </template>

    <template lwc:elseif={choosingPricebook}>
      <section
        class="modal-layer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pricebook-modal-title"
      >
        <div class="modal-backdrop"></div>
        <div class="modal modal_medium">
          <header class="workspace__header modal__header">
            <div>
              <p class="eyebrow">{editorTitle}</p>
              <h2 id="pricebook-modal-title">Choose a price book</h2>
            </div>
            <button
              type="button"
              class="modal__close"
              onclick={handleCancelPricebook}
              aria-label="Close price book selection"
            >
              ×
            </button>
          </header>
          <section class="pricebook-picker modal__body">
            <p class="muted">
              The selected price book supplies the products and list prices for
              this Opportunity’s quotes.
            </p>
            <div class="pricebooks" role="radiogroup" aria-label="Price books">
              <template for:each={pricebookCards} for:item="pricebook">
                <button
                  key={pricebook.id}
                  type="button"
                  role="radio"
                  class={pricebook.className}
                  aria-checked={pricebook.ariaChecked}
                  data-id={pricebook.id}
                  data-disabled={pricebook.disabled}
                  disabled={pricebook.disabled}
                  onclick={handlePricebookPick}
                >
                  <span class="pb__top"
                    ><span class="pb__radio"></span
                    ><strong>{pricebook.name}</strong></span
                  >
                  <span class="muted">{pricebook.descriptionLabel}</span
                  ><span>{pricebook.countLabel}</span>
                </button>
              </template>
            </div>
            <div class="actions">
              <button
                type="button"
                class="btn btn_primary"
                onclick={handleSetPricebook}
                disabled={pickDisabled}
              >
                Use this price book
              </button>
            </div>
          </section>
        </div>
      </section>
    </template>

    <template lwc:elseif={editorOpen}>
      <section
        class="modal-layer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="quote-editor-modal-title"
      >
        <div class="modal-backdrop"></div>
        <div class="modal modal_medium modal_editor">
          <header class="workspace__header modal__header">
            <div>
              <p class="eyebrow">{context.opportunityName}</p>
              <h2 id="quote-editor-modal-title">{editorTitle}</h2>
              <span class="chip">{editorPricebookName} price book</span>
              <button
                type="button"
                class="btn btn_small change-pricebook"
                onclick={handleChangePricebook}
                disabled={busy}
              >
                Change price book
              </button>
            </div>
            <button
              type="button"
              class="modal__close"
              onclick={handleCancelEditor}
              disabled={busy}
              aria-label="Close quote editor"
            >
              ×
            </button>
          </header>
          <div class="editor modal__body">
            <section class="catalog" aria-label="Product catalogue">
              <h3>Add products</h3>
              <lightning-input
                type="search"
                label="Search products"
                variant="label-hidden"
                placeholder="Search products"
                value={search}
                onchange={handleSearch}
              ></lightning-input>
              <div
                class="pills"
                role="group"
                aria-label="Filter by product family"
              >
                <template for:each={familyPills} for:item="pill">
                  <button
                    key={pill.value}
                    type="button"
                    class={pill.className}
                    aria-pressed={pill.pressed}
                    data-family={pill.value}
                    onclick={handleFamily}
                  >
                    {pill.label}
                  </button>
                </template>
              </div>
              <ul class="products">
                <template for:each={catalogView} for:item="product">
                  <li key={product.pricebookEntryId} class={product.rowClass}>
                    <div class="stack">
                      <strong>{product.name}</strong
                      ><span class="muted">{product.familyLabel}</span>
                    </div>
                    <div class="product__right">
                      <div class="product__price stack">
                        <lightning-formatted-number
                          value={product.listPrice}
                          format-style="currency"
                          currency-code="USD"
                        ></lightning-formatted-number>
                        <template lwc:if={product.hasDeposit}>
                          <span class="product__deposit">
                            Deposit
                            <lightning-formatted-number
                              value={product.depositAmount}
                              format-style="currency"
                              currency-code="USD"
                            ></lightning-formatted-number>
                          </span>
                        </template>
                      </div>
                      <button
                        type="button"
                        class="btn btn_small"
                        data-id={product.pricebookEntryId}
                        disabled={product.addDisabled}
                        onclick={handleAdd}
                      >
                        + Add
                      </button>
                    </div>
                  </li>
                </template>
              </ul>
              <template lwc:if={catalogEmpty}
                ><p class="muted">No matching products.</p></template
              >
            </section>

            <section class="quote-editor" aria-label="Quote products">
              <template lwc:if={pricebookMismatch}>
                <p class="warning" role="alert">
                  This quote uses {editorPricebookName}, while the Opportunity
                  uses {context.pricebookName}. Select Change price book to
                  choose the correct catalogue before changing or saving
                  products.
                </p>
              </template>
              <div class="editor__options">
                <lightning-input
                  type="date"
                  label="Expiration date"
                  value={expirationDate}
                  onchange={handleExpiration}
                ></lightning-input>
                <lightning-textarea
                  label="Quote notes"
                  value={notes}
                  onchange={handleNotes}
                  max-length="2000"
                ></lightning-textarea>
              </div>
              <template lwc:if={hasRecurringLines}>
                <lightning-input
                  class="quote-term"
                  type="number"
                  label="Quote recurring term (months)"
                  value={termMonths}
                  onchange={handleQuoteTerm}
                  min="1"
                  max="1200"
                  step="1"
                  required
                  field-level-help="Default term for recurring products. A product can use a different term below."
                ></lightning-input>
              </template>
              <template lwc:if={hasCartLines}>
                <ul class="lines">
                  <template for:each={cartView} for:item="line">
                    <li key={line.key} class={line.lineClass}>
                      <div class="line__head">
                        <div class="stack">
                          <strong>{line.name}</strong>
                        </div>
                        <button
                          type="button"
                          class="icon-btn"
                          data-key={line.key}
                          onclick={handleRemove}
                          aria-label="Remove product"
                          title="Remove product"
                        >
                          <lightning-icon
                            icon-name="utility:close"
                            size="x-small"
                            alternative-text="Remove"
                          ></lightning-icon>
                        </button>
                      </div>
                      <div class="line__controls">
                        <div class="stepper">
                          <button
                            type="button"
                            data-key={line.key}
                            data-step="-1"
                            onclick={handleStep}
                            aria-label="Decrease quantity"
                          >
                            −
                          </button>
                          <input
                            type="number"
                            min="1"
                            max="9999"
                            value={line.quantity}
                            data-key={line.key}
                            onchange={handleQty}
                            aria-label="Quantity"
                            required
                          />
                          <button
                            type="button"
                            data-key={line.key}
                            data-step="1"
                            onclick={handleStep}
                            aria-label="Increase quantity"
                          >
                            +
                          </button>
                        </div>
                        <label class="disc"
                          ><span>Discount</span
                          ><input
                            type="number"
                            min="0"
                            max="100"
                            step="0.01"
                            value={line.discountPct}
                            data-key={line.key}
                            onchange={handleDiscount}
                            aria-label="Discount percent"
                          /><span>%</span></label
                        >
                        <div class="line__pricing">
                          <label class="line__unit-price">
                            <span>Unit price</span>
                            <input
                              type="number"
                              min="0"
                              step="0.01"
                              required
                              value={line.unitPrice}
                              data-key={line.key}
                              onchange={handleUnitPrice}
                              aria-label="Unit price"
                            />
                          </label>
                          <span class="line__original muted">
                            <span>Original list price</span>
                            <lightning-formatted-number
                              value={line.listPrice}
                              format-style="currency"
                              currency-code="USD"
                            ></lightning-formatted-number>
                            <span>each</span>
                          </span>
                          <strong class="line__total">
                            <span>Line total</span>
                            <lightning-formatted-number
                              value={line.net}
                              format-style="currency"
                              currency-code="USD"
                            ></lightning-formatted-number>
                          </strong>
                        </div>
                      </div>
                      <label class="line__deposit">
                        <span>Deposit per unit</span>
                        <input
                          type="number"
                          min="0"
                          step="0.01"
                          value={line.depositAmount}
                          data-key={line.key}
                          onchange={handleDeposit}
                          aria-label="Deposit per unit"
                          placeholder="Price book default"
                          title="Leave blank to use the price book deposit; enter 0 for no deposit."
                        />
                      </label>
                      <template lwc:if={line.isRecurring}>
                        <label class="line__term">
                          <span>Recurring term (months)</span>
                          <input
                            type="number"
                            min="1"
                            max="1200"
                            step="1"
                            value={line.termMonths}
                            data-key={line.key}
                            onchange={handleLineTerm}
                            placeholder="Use quote term"
                            aria-label="Product recurring term (months)"
                          />
                          <template lwc:if={line.effectiveTermMonths}>
                            <span class="muted"
                              >{line.effectiveTermMonths} months</span
                            >
                          </template>
                        </label>
                      </template>
                      <input
                        class="line__note"
                        type="text"
                        value={line.description}
                        data-key={line.key}
                        onchange={handleNote}
                        placeholder="Client-facing product note"
                        aria-label="Client-facing product note"
                        maxlength="255"
                      />
                      <template lwc:if={line.needsApproval}
                        ><p class="warning">
                          Discounts above {maxDiscount}% need manager approval.
                        </p></template
                      >
                    </li>
                  </template>
                </ul>
                <dl class="totals">
                  <div>
                    <dt>Subtotal</dt>
                    <dd>
                      <lightning-formatted-number
                        value={totals.subtotal}
                        format-style="currency"
                        currency-code="USD"
                      ></lightning-formatted-number>
                    </dd>
                  </div>
                  <div>
                    <dt>Discount</dt>
                    <dd>
                      −
                      <lightning-formatted-number
                        value={totals.discount}
                        format-style="currency"
                        currency-code="USD"
                      ></lightning-formatted-number>
                    </dd>
                  </div>
                  <div class="totals__grand">
                    <dt>Total</dt>
                    <dd>
                      <lightning-formatted-number
                        value={totals.total}
                        format-style="currency"
                        currency-code="USD"
                      ></lightning-formatted-number>
                    </dd>
                  </div>
                </dl>
              </template>
              <template lwc:else
                ><div class="empty">
                  <strong>No products in this quote</strong
                  ><span class="muted">Add products from the catalogue.</span>
                </div></template
              >
              <div class="actions">
                <button
                  type="button"
                  class="btn"
                  onclick={handleCancelEditor}
                  disabled={busy}
                >
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn_primary"
                  onclick={handleSaveQuote}
                  disabled={saveDisabled}
                >
                  Save quote
                </button>
              </div>
            </section>
          </div>
        </div>
      </section>
    </template>

    <template lwc:else>
      <header class="workspace__header">
        <div>
          <p class="eyebrow">{context.opportunityName}</p>
          <div class="title-row">
            <h2>{cardTitle}</h2>
            <span class="count">{quoteCountLabel}</span>
          </div>
        </div>
        <button type="button" class="btn btn_primary" onclick={handleNewQuote}>
          + New quote
        </button>
      </header>
      <template lwc:if={hasQuotes}>
        <ol class="timeline">
          <template for:each={quoteCards} for:item="quote">
            <li key={quote.quoteId} class="timeline__item">
              <span class="timeline__dot" aria-hidden="true"></span>
              <article class="quote-card">
                <header class="quote-card__header">
                  <div class="quote-card__main">
                    <button
                      type="button"
                      class="quote-link"
                      data-id={quote.quoteId}
                      onclick={handleOpenQuote}
                    >
                      {quote.name}
                    </button>
                    <span class={quote.statusClass}>{quote.status}</span>
                    <template lwc:if={quote.isSynced}
                      ><span class="synced">Synced</span></template
                    >
                  </div>
                  <strong class="quote-total"
                    ><lightning-formatted-number
                      value={quote.totalPrice}
                      format-style="currency"
                      currency-code="USD"
                    ></lightning-formatted-number
                  ></strong>
                </header>
                <div class="quote-meta">
                  <span>{quote.quoteNumber}</span
                  ><span
                    >Created
                    <lightning-formatted-date-time
                      value={quote.createdDate}
                      year="numeric"
                      month="short"
                      day="2-digit"
                    ></lightning-formatted-date-time
                  ></span>
                  <span
                    >Expires
                    <lightning-formatted-date-time
                      value={quote.expirationDate}
                      year="numeric"
                      month="short"
                      day="2-digit"
                    ></lightning-formatted-date-time
                  ></span>
                  <span>{quote.pricebookName}</span
                  ><span>{quote.lineCount} product(s)</span>
                  <template lwc:if={quote.termMonths}>
                    <span>Recurring term: {quote.termMonths} months</span>
                  </template>
                  <template lwc:if={quote.recipientEmail}
                    ><span>{quote.recipientEmail}</span></template
                  >
                </div>
                <div class="quote-actions">
                  <button
                    type="button"
                    class="btn btn_small"
                    data-id={quote.quoteId}
                    onclick={handleViewPdf}
                  >
                    {quote.pdfLabel}
                  </button>
                  <button
                    type="button"
                    class="btn btn_small"
                    data-id={quote.quoteId}
                    onclick={handleSendQuote}
                    disabled={quote.sendDisabled}
                  >
                    Send quote
                  </button>
                  <button
                    type="button"
                    class="btn btn_small"
                    data-id={quote.quoteId}
                    onclick={handleEditQuote}
                  >
                    Edit
                  </button>
                  <button
                    type="button"
                    class="btn btn_small btn_sync"
                    data-id={quote.quoteId}
                    onclick={handleSyncQuote}
                    disabled={quote.syncDisabled}
                  >
                    {quote.syncLabel}
                  </button>
                </div>
                <template lwc:if={quote.hasLines}>
                  <div
                    class="quote-lines"
                    role="table"
                    aria-label="Quote products"
                  >
                    <div class="quote-lines__head" role="row">
                      <span>Product</span><span>Qty</span><span>Discount</span
                      ><span>Total</span>
                    </div>
                    <template for:each={quote.lines} for:item="line">
                      <div
                        key={line.lineId}
                        class="quote-lines__row"
                        role="row"
                      >
                        <div class="stack">
                          <strong>{line.name}</strong
                          ><template lwc:if={line.description}
                            ><span class="muted"
                              >{line.description}</span
                            ></template
                          >
                          <template lwc:if={line.termLabel}>
                            <span class="muted">{line.termLabel}</span>
                          </template>
                          <template lwc:if={line.hasDeposit}>
                            <span class="muted line__deposit-summary">
                              <span>Deposit per unit</span>
                              <lightning-formatted-number
                                value={line.depositAmount}
                                format-style="currency"
                                currency-code="USD"
                              ></lightning-formatted-number>
                            </span>
                          </template>
                        </div>
                        <span>{line.quantity}</span
                        ><span>{line.discountPct}%</span>
                        <strong
                          ><lightning-formatted-number
                            value={line.totalPrice}
                            format-style="currency"
                            currency-code="USD"
                          ></lightning-formatted-number
                        ></strong>
                      </div>
                    </template>
                  </div>
                </template>
                <template lwc:if={quote.notes}
                  ><p class="quote-notes">{quote.notes}</p></template
                >
              </article>
            </li>
          </template>
        </ol>
      </template>
      <template lwc:else
        ><div class="empty empty_list">
          <strong>No quotes yet</strong
          ><span class="muted"
            >Create the first quote and add products inside it.</span
          >
          <button
            type="button"
            class="btn btn_primary"
            onclick={handleNewQuote}
          >
            Create quote
          </button>
        </div></template
      >
    </template>

    <template lwc:if={busy}
      ><lightning-spinner
        alternative-text="Working"
        size="small"
      ></lightning-spinner
    ></template>

    <template lwc:if={sendModalOpen}>
      <section
        class="modal-layer send-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="send-modal-title"
      >
        <div class="modal-backdrop"></div>
        <div class="modal modal_medium modal_send">
          <header class="workspace__header modal__header">
            <div>
              <p class="eyebrow">End-user delivery</p>
              <h2 id="send-modal-title">Send quote by email</h2>
            </div>
            <button
              type="button"
              class="modal__close"
              onclick={handleCloseSend}
              disabled={busy}
              aria-label="Close email dialog"
            >
              ×
            </button>
          </header>
          <div class="modal__body send-form">
            <template lwc:if={showSendLoading}>
              <div class="send-loading" role="status" aria-live="polite">
                <span class="send-loading__spinner">
                  <lightning-spinner
                    alternative-text={sendLoadingLabel}
                    size="small"
                  ></lightning-spinner>
                </span>
                <strong>{sendLoadingLabel}</strong>
              </div>
            </template>
            <div class="composer-row">
              <span class="composer-row__label">
                <abbr title="required">*</abbr> From
              </span>
              <lightning-combobox
                class="composer-row__control"
                variant="label-hidden"
                label="From address"
                value={selectedFromAddressId}
                options={fromAddressOptions}
                onchange={handleFromAddressChange}
              ></lightning-combobox>
            </div>
            <div class="composer-row composer-row_to">
              <span class="composer-row__label">
                <abbr title="required">*</abbr> To
              </span>
              <div class="recipient-lookup composer-row__control">
                <div class="recipient-lookup__selection">
                  <template for:each={recipientPills} for:item="recipient">
                    <lightning-pill
                      key={recipient.key}
                      name={recipient.key}
                      label={recipient.label}
                      onremove={handleRemoveRecipient}
                    >
                      <template lwc:if={recipient.contactId}>
                        <lightning-icon
                          icon-name="standard:contact"
                          alternative-text="Contact"
                        ></lightning-icon>
                      </template>
                    </lightning-pill>
                  </template>
                  <lightning-input
                    class="recipient-lookup__input"
                    type="search"
                    variant="label-hidden"
                    label="Recipient email or contact"
                    value={recipientSearch}
                    placeholder="Search account contacts or enter an email"
                    onfocus={handleRecipientFocus}
                    onclick={handleRecipientFocus}
                    oninput={handleSendEmailChange}
                    onkeydown={handleRecipientKeyDown}
                  ></lightning-input>
                </div>
                <template lwc:if={showRecipientContactMenu}>
                  <div class="recipient-lookup__menu" role="listbox">
                    <template lwc:if={hasRecipientContactMatches}>
                      <template
                        for:each={recipientContactMatches}
                        for:item="contact"
                      >
                        <button
                          key={contact.id}
                          type="button"
                          class="recipient-lookup__option"
                          data-id={contact.id}
                          onclick={handleSelectRecipient}
                          role="option"
                        >
                          <lightning-icon
                            icon-name="standard:contact"
                            size="small"
                            alternative-text="Contact"
                          ></lightning-icon>
                          <span class="stack">
                            <strong>{contact.name}</strong>
                            <span class="muted">{contact.detail}</span>
                          </span>
                        </button>
                      </template>
                    </template>
                    <template lwc:else>
                      <div class="recipient-lookup__empty">
                        No email-enabled Contacts found on the related Account.
                        You can enter an email address manually.
                      </div>
                    </template>
                  </div>
                </template>
              </div>
              <button
                type="button"
                class="composer-row__toggle"
                onclick={handleToggleCc}
                aria-expanded={showCc}
              >
                Cc
              </button>
            </div>
            <template lwc:if={showCc}>
              <div class="composer-row">
                <span class="composer-row__label">Cc</span>
                <lightning-input
                  class="composer-row__control"
                  type="text"
                  variant="label-hidden"
                  label="CC"
                  value={sendCc}
                  placeholder="name@example.com, another@example.com"
                  onchange={handleSendCcChange}
                ></lightning-input>
              </div>
            </template>
            <div class="composer-row">
              <span class="composer-row__label">Template</span>
              <lightning-combobox
                class="composer-row__control"
                variant="label-hidden"
                label="Email template"
                value={selectedEmailTemplateId}
                options={emailTemplateOptions}
                onchange={handleEmailTemplateChange}
              ></lightning-combobox>
            </div>
            <div class="composer-row">
              <span class="composer-row__label">
                <abbr title="required">*</abbr> Subject
              </span>
              <lightning-input
                class="composer-row__control"
                type="text"
                variant="label-hidden"
                label="Subject"
                value={sendSubject}
                required
                disabled={emailDraftLoading}
                onchange={handleSendSubjectChange}
              ></lightning-input>
            </div>
            <div class="send-form__body">
              <span class="send-form__label">HTML body</span>
              <template lwc:if={emailDraftLoading}>
                <div class="send-form__loading">
                  <lightning-spinner
                    alternative-text="Loading email template"
                    size="small"
                  ></lightning-spinner>
                </div>
              </template>
              <template lwc:else>
                <lightning-input-rich-text
                  value={sendHtmlBody}
                  onchange={handleSendBodyChange}
                ></lightning-input-rich-text>
              </template>
            </div>
            <div class="attachment-card">
              <span class="attachment-card__icon">
                <lightning-icon
                  icon-name="doctype:pdf"
                  size="small"
                  alternative-text="Quote PDF attached"
                ></lightning-icon>
              </span>
              <span class="stack">
                <strong>{sendAttachmentName}</strong>
                <span class="muted">Current branded quote PDF · Attached</span>
              </span>
              <span class="attachment-card__status">Attached</span>
            </div>
            <div class="send-form__notice">
              A completed email activity with recipient, CC, template, and From
              address details will be added to this Opportunity.
            </div>
            <div class="actions send-form__actions">
              <button
                type="button"
                class="btn"
                onclick={handleCloseSend}
                disabled={busy}
              >
                Cancel
              </button>
              <button
                type="button"
                class="btn btn_primary"
                onclick={handleConfirmSend}
                disabled={sendActionDisabled}
              >
                {sendActionLabel}
              </button>
            </div>
          </div>
        </div>
      </section>
    </template>

    <template lwc:if={pdfModalOpen}>
      <section
        class="modal-layer pdf-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pdf-modal-title"
      >
        <div class="modal-backdrop"></div>
        <div class="modal modal_medium">
          <header class="workspace__header modal__header">
            <div>
              <p class="eyebrow">Quote document</p>
              <h2 id="pdf-modal-title">Quote PDF</h2>
            </div>
            <button
              type="button"
              class="modal__close"
              onclick={handleClosePdf}
              aria-label="Close PDF preview"
            >
              ×
            </button>
          </header>
          <div class="modal__body pdf-modal__body">
            <template lwc:if={pdfLoading}>
              <div class="modal__state">
                <lightning-spinner
                  alternative-text="Generating quote PDF"
                  size="medium"
                ></lightning-spinner>
                <p>Generating PDF…</p>
              </div>
            </template>
            <template lwc:elseif={pdfError}>
              <div class="modal__state state_error" role="alert">
                {pdfError}
              </div>
            </template>
            <template lwc:else>
              <iframe
                class="pdf-frame"
                src={pdfUrl}
                title="Quote PDF preview"
              ></iframe>
            </template>
          </div>
        </div>
      </section>
    </template>
  </article>
</template>
