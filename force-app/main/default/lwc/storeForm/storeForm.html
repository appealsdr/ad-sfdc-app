    <!-- New Store Section -->
    
    <template if:true={storeCrreation} >
    <div class="slds-box sectionHeader headerBox  slds-grid slds-grid_vertical-align-center">
        <p>&nbsp;&nbsp;Create New Store</p>
    </div>
 
    
    <div class="marginTopInMinus">


        
        <!-- <lightning-layout multiple-rows>
            <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-p-around_x-small slds-p-left_none">
                <lightning-combobox
                    class="slds-m-left_large"
                    label="Store Record Type"

        </lightning-layout> -->
        <lightning-record-edit-form
            object-api-name="Store__c"
            onsubmit={handleSubmit}
            onsuccess={handleSuccess}
            record-type-id={selectedRecordTypeId}>
            <lightning-messages></lightning-messages>
            <div class="slds-m-around_medium">
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-p-around_x-small">
                        <lightning-combobox
                            class=""
                            label="Record Type"
                            variant="label-inline"
                            value={selectedRecordTypeId}
                            options={storeRecordTypeOptions}
                            onchange={handlePicklistChange}>
                        </lightning-combobox>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-p-around_x-small">
                           <div style="display:flex;">
                                <label class="slds-form-element__label" style="margin-right: 25px;">
                                    Marketplace
                                </label>
                                <c-slds-custom-lookup-reusable
                                    placeholder="Search Marketplace..." 
                                    onselectionchange={handleLookupSelectionChange} 
                                    onsearch={handleLookupServerSearch}
                                    class-name="marketplace" 
                                    class="marketplace">
                                </c-slds-custom-lookup-reusable>
                            </div>
                    </lightning-layout-item>
                  
                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-p-around_x-small">
                        <lightning-input-field field-name="Name"  variant="label-inline" value={storeName} onchange={handleInputChange}></lightning-input-field>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" medium-device-size="6" large-device-size="6" class="slds-p-around_x-small">
                        <lightning-button variant="brand" type="submit" name="save" label="Create New Store" disabled={isDisbleCreateNewStoreBtn}></lightning-button>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </lightning-record-edit-form>
    </div>

    </template>

    <template if:true={showStoreInstruction}>
        <div class="store-message" lwc:dom="manual"></div>
    </template>

    <!-- Existing Store Section-->
    <div class="slds-box sectionHeader headerBox marginTopInMinus  slds-grid slds-grid_vertical-align-center">
        <p>&nbsp;&nbsp;Existing Stores</p>
    </div>
    <div if:true={swichInfoSecExistStrores} class="marginTopInMinus" style="max-height: 500px;overflow:auto;">
        <lightning-layout multiple-rows>
            <lightning-layout-item size="12" small="12" medium="12" large="12" class="slds-p-around_x-small">
                <lightning-datatable
                    key-field="Id"
                    columns={getExistingStoreColumns}
                    data={getStoreRecords}
                    class="slds-p-around_small"
                    hide-checkbox-column={showStoreSelection}
                    show-row-number-column	
                    selected-rows={selectedStoreIds}
                    single-row-selection-mode={selectionMode}
                    onrowselection={handleRowSelection}>
                </lightning-datatable>
            </lightning-layout-item>       
        </lightning-layout> 
    </div>
</template>
