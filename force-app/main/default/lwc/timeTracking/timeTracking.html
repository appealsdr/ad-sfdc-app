<template>
    <lightning-card title="Time Tracking" icon-name="standard:timesheet">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="timer-section slds-p-around_medium slds-text-align_center">
                <template if:true={hasActiveTimer}>
                    <p class="slds-text-heading_large timer-display">{elapsedDisplay}</p>
                    <p class="slds-text-body_small slds-m-bottom_medium">Timer in progress</p>
                </template>

                <div class="button-row slds-m-vertical_medium">
                    <template if:true={showStartButton}>
                        <lightning-button
                            label="Start"
                            variant="brand"
                            onclick={handleStartClick}
                            disabled={isProcessing}
                            class="timer-button">
                        </lightning-button>
                    </template>

                    <template if:true={hasActiveTimer}>
                        <lightning-button
                            label="Complete"
                            variant="success"
                            onclick={handleCompleteClick}
                            disabled={isProcessing}
                            class="timer-button">
                        </lightning-button>
                    </template>
                </div>
            </div>

            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <p class="slds-text-title_bold">
                        Total Minutes: {formattedTotalMinutes}
                    </p>
                    <lightning-button
                        label="Add Manual Entry"
                        variant="neutral"
                        onclick={handleAddManualClick}>
                    </lightning-button>
                </div>

                <lightning-datatable
                    key-field="id"
                    data={tableData}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>

                <template if:false={tableData.length}>
                    <p class="slds-p-vertical_small slds-text-color_weak">No time tracking records found.</p>
                </template>
            </div>
        </template>
    </lightning-card>

    <template if:true={showBlockingModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Timer Already Running</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{blockingMessage}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleBlockingCancelClick}></lightning-button>
                    <lightning-button
                        label="Completed"
                        variant="brand"
                        class="slds-m-left_small"
                        onclick={handleBlockingCompleteClick}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showCommentModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        label="Comments (optional)"
                        value={modalComments}
                        maxlength="255"
                        rows="5"
                        onchange={handleCommentChange}>
                    </lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleModalCancel}></lightning-button>
                    <lightning-button
                        label="OK"
                        variant="brand"
                        class="slds-m-left_small"
                        onclick={handleModalConfirm}
                        disabled={isProcessing}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showManualModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{manualModalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-gutters slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                            <lightning-input
                                type="date"
                                label="Date"
                                required
                                data-field="manualDate"
                                value={manualDate}
                                onchange={handleManualFieldChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <lightning-input
                                type="time"
                                label="Start Time"
                                data-field="manualStartTime"
                                value={manualStartTime}
                                onchange={handleManualFieldChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <lightning-input
                                type="time"
                                label="End Time"
                                data-field="manualEndTime"
                                value={manualEndTime}
                                onchange={handleManualFieldChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1">
                            <lightning-textarea
                                label="Comments (optional)"
                                maxlength="255"
                                rows="5"
                                data-field="manualComments"
                                value={manualComments}
                                onchange={handleManualFieldChange}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleManualCancel}></lightning-button>
                    <lightning-button
                        label="Save"
                        variant="brand"
                        class="slds-m-left_small"
                        onclick={handleManualConfirm}
                        disabled={isProcessing}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
