<template>
    <lightning-card title={cardTitle} icon-name="standard:lead">

        <!-- ─── STEP 1: FORM INPUTS ───────────────────────────────────────── -->
        <div class="slds-p-horizontal_medium slds-p-top_medium">
            <div class="slds-grid slds-gutters slds-wrap">

                <!-- Upload Name -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        label="Upload Name"
                        value={uploadName}
                        onchange={handleUploadNameChange}
                        required
                        class={uploadNameClass}
                        message-when-value-missing="Upload Name is required."
                        placeholder="e.g. April 2026 Cold List">
                    </lightning-input>
                </div>

                <!-- Source — combobox driven by Lead.LeadSource picklist values -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <template if:true={hasSourceOptions}>
                        <lightning-combobox
                            label="Source"
                            value={source}
                            options={sourceOptions}
                            onchange={handleSourceChange}
                            required
                            class={sourceClass}
                            message-when-value-missing="Source is required."
                            placeholder="Select a Lead Source…">
                        </lightning-combobox>
                    </template>
                    <template if:false={hasSourceOptions}>
                        <!-- Fallback: field isn't a picklist, or Apex returned nothing yet -->
                        <lightning-input
                            label="Source"
                            value={source}
                            onchange={handleSourceChange}
                            required
                            class={sourceClass}
                            message-when-value-missing="Source is required."
                            placeholder="e.g. Cold List">
                        </lightning-input>
                    </template>
                </div>

            </div>

            <!-- Validation banner -->
            <template if:true={showValidationError}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-top_small" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <lightning-icon
                        icon-name="utility:error"
                        alternative-text="Error"
                        variant="inverse"
                        size="x-small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    Please fill in <strong>Upload Name</strong> and <strong>Source</strong> before selecting a file.
                </div>
            </template>

            <!-- File Upload -->
            <div class="slds-m-top_medium">
                <lightning-input
                    type="file"
                    label="Select CSV File"
                    accept=".csv"
                    onchange={handleFileChange}
                    disabled={isFileInputDisabled}>
                </lightning-input>
                <template if:true={fileName}>
                    <p class="slds-text-body_small slds-m-top_x-small slds-text-color_success">
                        ✓ {fileName}
                    </p>
                </template>
            </div>
        </div>

        <!-- ─── LOADING SPINNER ───────────────────────────────────────────── -->
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner
                    alternative-text="Loading"
                    size="medium"
                    variant="brand">
                </lightning-spinner>
                <p class="slds-m-top_small slds-text-align_center">{loadingMessage}</p>
            </div>
        </template>

        <!-- ─── STEP 2: PREVIEW TABLE ─────────────────────────────────────── -->
        <template if:true={showPreview}>
            <div class="slds-p-horizontal_medium slds-m-top_medium">

                <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                    <h3 class="slds-text-heading_small">
                        Preview
                        <span class="slds-badge slds-m-left_x-small">{previewRowCount} of {totalRowCount} rows</span>
                        <template if:true={previewCapped}>
                            <span class="slds-text-body_small slds-text-color_weak"> (showing first 50)</span>
                        </template>
                    </h3>
                    <lightning-button
                        label="Clear"
                        title="Clear file and start over"
                        onclick={handleClear}
                        variant="neutral"
                        icon-name="utility:clear">
                    </lightning-button>
                </div>

                <!-- Horizontal scroll wrapper for wide tables -->
                <div class="table-wrapper">
                    <lightning-datatable
                        key-field="__id"
                        data={previewData}
                        columns={previewColumns}
                        hide-checkbox-column
                        column-widths-mode="auto"
                        resize-column-disabled>
                    </lightning-datatable>
                </div>

                <!-- Upload CTA -->
                <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                    <lightning-button
                        label={uploadButtonLabel}
                        variant="brand"
                        icon-name="utility:upload"
                        onclick={handleUpload}
                        disabled={isUploading}>
                    </lightning-button>
                </div>
            </div>
        </template>

        <!-- ─── STEP 3: RESULT BANNER ─────────────────────────────────────── -->
        <template if:true={showResult}>
            <div class="slds-p-around_medium">

                <!-- Success -->
                <template if:true={hasSuccesses}>
                    <div class="slds-notify slds-notify_alert slds-theme_success slds-m-bottom_small" role="status">
                        <lightning-icon
                            icon-name="utility:success"
                            alternative-text="Success"
                            variant="inverse"
                            size="x-small"
                            class="slds-m-right_x-small">
                        </lightning-icon>
                        <strong>{importResult.successCount}</strong> Lead(s) imported successfully.
                    </div>
                </template>

                <!-- Failures -->
                <template if:true={hasFailures}>
                    <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
                        <lightning-icon
                            icon-name="utility:error"
                            alternative-text="Error"
                            variant="inverse"
                            size="x-small"
                            class="slds-m-right_x-small">
                        </lightning-icon>
                        <strong>{importResult.failureCount}</strong> row(s) were not uploaded. Review the list below — these leads can be fixed in the CSV and re-imported.
                    </div>

                    <!-- Detailed table of not-uploaded leads -->
                    <template if:true={hasFailedLeads}>
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_medium slds-m-bottom_x-small">
                            <h3 class="slds-text-heading_small">
                                Not uploaded leads
                                <span class="slds-badge slds-m-left_x-small">{importResult.failureCount}</span>
                            </h3>
                            <lightning-button
                                label="Download CSV"
                                title="Download the list of not-uploaded leads as a CSV file"
                                onclick={handleDownloadFailed}
                                variant="neutral"
                                icon-name="utility:download">
                            </lightning-button>
                        </div>
                        <div class="table-wrapper">
                            <lightning-datatable
                                key-field="__id"
                                data={failedTableData}
                                columns={failedTableColumns}
                                hide-checkbox-column
                                column-widths-mode="auto"
                                resize-column-disabled>
                            </lightning-datatable>
                        </div>
                    </template>
                </template>

                <div class="slds-m-top_medium slds-grid slds-grid_align-center">
                    <lightning-button
                        label="Import Another File"
                        variant="neutral"
                        icon-name="utility:refresh"
                        onclick={handleReset}>
                    </lightning-button>
                </div>
            </div>
        </template>

    </lightning-card>
</template>
