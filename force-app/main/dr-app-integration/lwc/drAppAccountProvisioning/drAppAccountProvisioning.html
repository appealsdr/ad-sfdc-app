<template>
    <lightning-card title="App Account Provisioning" icon-name="standard:account">
        <div slot="actions">
            <lightning-button-group>
                <lightning-button
                    variant="brand"
                    label="Provision Account"
                    title="Provision the selected contact in the  App"
                    onclick={handleProvision}
                    disabled={isProvisionDisabled}>
                </lightning-button>
                <lightning-button
                    variant="neutral"
                    label="Reset Password"
                    title="Reset password for the selected contact if they already exist in the  App"
                    onclick={handleResetPassword}
                    disabled={isResetDisabled}>
                </lightning-button>
            </lightning-button-group>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template if:true={errorMessage}>
                <div class="slds-m-bottom_small slds-text-color_error" role="alert">
                    {errorMessage}
                </div>
            </template>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Working..." size="small"></lightning-spinner>
            </template>

            <div class="slds-form-element slds-m-bottom_medium">
                <label class="slds-form-element__label" for="contact-select">Contact</label>
                <div class="slds-form-element__control">
                    <lightning-combobox
                        name="contact"
                        label="Contact"
                        variant="label-hidden"
                        value={selectedContactId}
                        placeholder="Select a contact"
                        options={contactOptions}
                        onchange={handleContactChange}
                        disabled={isLoading}>
                    </lightning-combobox>
                </div>
            </div>

            <template if:true={temporaryPassword}>
                <div class="slds-box slds-theme_shade slds-m-top_medium">
                    <p class="slds-text-title_bold slds-m-bottom_x-small">Temporary Password</p>
                    <p class="slds-text-heading_small" style="font-family: monospace;">{temporaryPassword}</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        This password is shown once and has also been saved to the contact's
                        "Temp Password for App" field. It cannot be retrieved again from the App.
                    </p>
                </div>
            </template>

            <template if:true={username}>
                <p class="slds-m-top_small"><strong>Username:</strong> {username}</p>
            </template>
        </div>
    </lightning-card>

    <template if:true={showNotifyConfirm}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Notify User</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Do you want to notify user about reset password?</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="neutral"
                        label="No"
                        onclick={handleNotifyNo}>
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Yes"
                        class="slds-m-left_x-small"
                        onclick={handleNotifyYes}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
