<template>
    <lightning-card title="Time Tracking" icon-name="standard:timesheet">
        <div slot="actions" class="card-actions">
            <template if:true={showStartButton}>
                <lightning-button-icon
                    icon-name="utility:play"
                    variant="brand"
                    alternative-text="Start timer"
                    title="Start timer"
                    aria-label="Start timer"
                    onclick={handleStartClick}
                    disabled={actionsDisabled}>
                </lightning-button-icon>
            </template>
            <template if:true={hasActiveTimer}>
                <button
                    type="button"
                    data-action="stop"
                    title="Stop timer"
                    aria-label="Stop timer"
                    class="slds-button slds-button_icon stop-button"
                    onclick={handleCompleteClick}
                    disabled={actionsDisabled}>
                    <lightning-icon icon-name="utility:stop" variant="inverse" size="x-small"></lightning-icon>
                    <span class="slds-assistive-text">Stop timer</span>
                </button>
            </template>
            <lightning-button-icon
                icon-name="utility:add"
                alternative-text="Add manual entry"
                title="Add manual entry"
                aria-label="Add manual entry"
                onclick={handleAddManualClick}
                disabled={actionsDisabled}>
            </lightning-button-icon>
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh time tracking"
                title="Refresh time tracking"
                aria-label="Refresh time tracking"
                onclick={handleRefresh}
                disabled={actionsDisabled}>
            </lightning-button-icon>
        </div>
        <template if:true={isLoading}>
            <div class="loading-section slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="tracking-body slds-p-horizontal_medium slds-p-bottom_small">
                <template if:true={isRefreshing}>
                    <lightning-spinner alternative-text="Refreshing time tracking" size="small"></lightning-spinner>
                </template>
                <template if:true={showTimerSummary}>
                    <div class="tracking-summary slds-m-bottom_small">
                        <div class="timer-section">
                            <template if:true={hasActiveTimer}>
                                <span class="timer-display">{elapsedDisplay}</span>
                                <span class="slds-text-body_small slds-text-color_weak">Timer in progress</span>
                            </template>
                            <template if:true={hasBlockingTimer}>
                                <span class="blocking-timer-notice" role="status">
                                    <template if:true={blockingRecordUrl}>
                                        <a class="other-record-badge" href={blockingRecordUrl} title={blockingMessage} aria-label={blockingTimerBadgeDescription}>
                                            <span class="timer-display">{blockingElapsedDisplay}</span>
                                            <span class="other-record-label">{blockingTimerBadgeLabel}</span>
                                        </a>
                                    </template>
                                    <template if:false={blockingRecordUrl}>
                                        <span class="other-record-badge" title={blockingMessage} aria-label={blockingTimerBadgeDescription}>
                                            <span class="timer-display">{blockingElapsedDisplay}</span>
                                            <span class="other-record-label">{blockingTimerBadgeLabel}</span>
                                        </span>
                                    </template>
                                </span>
                            </template>
                        </div>
                    </div>
                </template>

                <lightning-accordion
                    allow-multiple-sections-open
                    active-section-name={activeSections}
                    onsectiontoggle={handleSectionToggle}>
                    <lightning-accordion-section name="logged-time" label="Logged Time">
                        <lightning-badge slot="actions" label={loggedRecordCount} title={loggedRecordCountLabel}></lightning-badge>
                        <p class="logged-total slds-text-title_bold slds-m-bottom_small">Total logged time: {formattedLoggedTime}</p>
                        <lightning-datatable
                            key-field="id"
                            data={tableData}
                            columns={columns}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                        </lightning-datatable>
                        <template if:false={tableData.length}>
                            <p class="slds-p-vertical_small slds-text-color_weak">No time tracking records found.</p>
                        </template>
                    </lightning-accordion-section>
                </lightning-accordion>
            </div>
        </template>
    </lightning-card>

    <template if:true={showBlockingModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Timer Already Running</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{blockingMessage}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleBlockingCancelClick}></lightning-button>
                    <lightning-button
                        label="Completed"
                        variant="brand"
                        class="slds-m-left_small"
                        onclick={handleBlockingCompleteClick}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showCommentModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        label="Comments (optional)"
                        value={modalComments}
                        maxlength="255"
                        rows="5"
                        onchange={handleCommentChange}>
                    </lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleModalCancel}></lightning-button>
                    <lightning-button
                        label="OK"
                        variant="brand"
                        class="slds-m-left_small"
                        onclick={handleModalConfirm}
                        disabled={isProcessing}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={showManualModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{manualModalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-gutters slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                            <lightning-input
                                type="date"
                                label="Date"
                                required
                                data-field="manualDate"
                                value={manualDate}
                                onchange={handleManualFieldChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <lightning-input
                                type="time"
                                label="Start Time"
                                data-field="manualStartTime"
                                value={manualStartTime}
                                onchange={handleManualFieldChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <lightning-input
                                type="time"
                                label="End Time"
                                data-field="manualEndTime"
                                value={manualEndTime}
                                onchange={handleManualFieldChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1">
                            <lightning-textarea
                                label="Comments (optional)"
                                maxlength="255"
                                rows="5"
                                data-field="manualComments"
                                value={manualComments}
                                onchange={handleManualFieldChange}>
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleManualCancel}></lightning-button>
                    <lightning-button
                        label="Save"
                        variant="brand"
                        class="slds-m-left_small"
                        onclick={handleManualConfirm}
                        disabled={isProcessing}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
