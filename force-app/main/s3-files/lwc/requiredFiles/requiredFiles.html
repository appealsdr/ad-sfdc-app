<template>
    <lightning-card title="Required Files" icon-name="standard:file">
        <div slot="actions">
            <lightning-button-icon
                class="slds-m-right_x-small"
                icon-name="utility:refresh"
                alternative-text="Refresh files"
                title="Refresh files"
                disabled={isLoading}
                onclick={handleRefresh}>
            </lightning-button-icon>
            <lightning-button
                label="New"
                variant="brand"
                disabled={isLoading}
                onclick={handleNewClick}>
            </lightning-button>
        </div>

        <div class="toolbar">
            <lightning-input
                type="search"
                label="Search required files and uploaded files"
                variant="label-hidden"
                placeholder="Search by name, description, upload status, or file name"
                value={searchTerm}
                onchange={handleSearchChange}>
            </lightning-input>
        </div>

        <template if:true={isLoading}>
            <div class="loading-wrap">
                <lightning-spinner size="medium" alternative-text="Loading required files"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={noFiles}>
                <p class="empty-state">{emptyStateMessage}</p>
            </template>

            <template if:true={hasFiles}>
                <div class="table-wrap">
                    <lightning-tree-grid
                        aria-label="Required files and uploaded files"
                        key-field="id"
                        data={filteredFiles}
                        columns={columns}
                        column-widths-mode="fixed"
                        expanded-rows={expandedRows}
                        hide-checkbox-column
                        onrowaction={handleRowAction}
                        ontoggle={handleRowToggle}>
                    </lightning-tree-grid>
                </div>
            </template>
        </template>
    </lightning-card>

    <template if:true={isCreateModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">New Required File</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-radio-group
                        label="Creation Type"
                        options={createModeOptions}
                        value={createMode}
                        type="button"
                        onchange={handleCreateModeChange}>
                    </lightning-radio-group>

                    <template if:true={isDefaultMode}>
                        <div class="form-section">
                            <lightning-input
                                label="Name"
                                value={defaultName}
                                required
                                onchange={handleDefaultNameChange}>
                            </lightning-input>
                            <lightning-dual-listbox
                                label="Accepted Format"
                                source-label="Available"
                                selected-label="Selected"
                                options={acceptedFormatOptions}
                                value={selectedAcceptedFormats}
                                required
                                onchange={handleAcceptedFormatChange}>
                            </lightning-dual-listbox>
                            <lightning-textarea
                                label="Short Description"
                                value={defaultShortDescription}
                                required
                                max-length="1000"
                                onchange={handleDefaultShortDescriptionChange}>
                            </lightning-textarea>
                            <lightning-input-rich-text
                                label="Instructions"
                                value={defaultInstructions}
                                onchange={handleDefaultInstructionsChange}>
                            </lightning-input-rich-text>
                        </div>
                    </template>

                    <template if:true={isTemplateMode}>
                        <div class="form-section">
                            <lightning-datatable
                                key-field="id"
                                data={templates}
                                columns={templateColumns}
                                max-row-selection="1"
                                onrowselection={handleTemplateSelection}>
                            </lightning-datatable>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseCreateModal}></lightning-button>
                    <template if:true={isDefaultMode}>
                        <lightning-button
                            label="Create"
                            variant="brand"
                            disabled={disableSaveDefault}
                            onclick={handleSaveDefault}>
                        </lightning-button>
                    </template>
                    <template if:true={isTemplateMode}>
                        <lightning-button
                            label="Create"
                            variant="brand"
                            disabled={disableSaveTemplate}
                            onclick={handleSaveTemplate}>
                        </lightning-button>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isPreviewModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container preview-modal-container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        class="slds-modal__close"
                        icon-name="utility:close"
                        variant="bare-inverse"
                        alternative-text="Close preview"
                        title="Close preview"
                        onclick={handleClosePreviewModal}>
                    </lightning-button-icon>
                    <h2 class="slds-text-heading_medium">{previewFileName}</h2>
                </header>
                <div class="slds-modal__content preview-content">
                    <lightning-layout class="preview-layout">
                        <lightning-layout-item size="3" class="preview-navigation">
                            <lightning-vertical-navigation
                                selected-item={selectedPreviewNavigationItem}
                                onbeforeselect={handlePreviewNavigationBeforeSelect}
                                onselect={handlePreviewNavigationSelect}>
                                <lightning-vertical-navigation-section label="Files">
                                    <template for:each={previewNavigationItems} for:item="item">
                                        <template if:true={item.isFolder}>
                                            <lightning-vertical-navigation-item-icon
                                                key={item.navigationName}
                                                label={item.label}
                                                name={item.navigationName}
                                                icon-name={item.iconName}>
                                            </lightning-vertical-navigation-item-icon>
                                        </template>
                                        <template if:true={item.isDocument}>
                                            <lightning-vertical-navigation-item-icon
                                                key={item.navigationName}
                                                label={item.label}
                                                name={item.navigationName}
                                                icon-name={item.iconName}>
                                            </lightning-vertical-navigation-item-icon>
                                        </template>
                                    </template>
                                </lightning-vertical-navigation-section>
                            </lightning-vertical-navigation>
                        </lightning-layout-item>

                        <lightning-layout-item size="9" class="preview-pane">
                            <div class="slds-p-around_medium">
                                <template if:true={isPreviewLoading}>
                                    <div class="loading-wrap">
                                        <lightning-spinner size="medium" alternative-text="Loading preview"></lightning-spinner>
                                    </div>
                                </template>

                                <template if:true={showImagePreview}>
                                    <img src={previewUrl} alt={previewFileName} class="preview-image" />
                                </template>

                                <template if:true={showPdfPreview}>
                                    <iframe src={previewUrl} title={previewFileName} class="preview-frame"></iframe>
                                </template>

                                <template if:true={showVideoPreview}>
                                    <video controls src={previewUrl} class="preview-video"></video>
                                </template>

                                <template if:true={showTextPreview}>
                                    <iframe src={previewUrl} title={previewFileName} class="preview-frame"></iframe>
                                </template>

                                <template if:true={showUnsupportedPreview}>
                                    <p class="empty-state">Preview is not available for this file type.</p>
                                </template>

                                <template if:true={showPreviewError}>
                                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                                        <lightning-icon
                                            icon-name="utility:error"
                                            size="x-small"
                                            variant="inverse"
                                            alternative-text="Error">
                                        </lightning-icon>
                                        <span class="slds-m-left_x-small">{previewError}</span>
                                    </div>
                                </template>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={handleClosePreviewModal}></lightning-button>
                    <lightning-button
                        label="Download"
                        variant="brand"
                        onclick={handleDownloadPreview}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
